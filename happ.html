<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Приложение Happ — DJARB VPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<body data-page="apps">
<div id="djarbLoginGate"></div>

<div id="siteContent">
<div id="djarbHeader"></div>
<div id="djarbMobileMenu"></div>

<main class="page-main">
  <div class="wrap">
    <div id="page">
      <div class="section-head">
        <p class="kicker">клиент</p>
        <h2 class="section-title">Приложение Happ</h2>
        <p class="section-desc">Вкладка «Приложение» — что это за клиент и какие настройки в нём рекомендуются. Вкладка «Ошибки» — отдельно разобранные сбои конкретно этого приложения.</p>
      </div>

      <div class="app-switch">
        <a href="happ.html" class="active">Happ</a>
        <a href="incy.html">Incy</a>
      </div>

      <div class="subtabbar" data-group="happ">
        <button class="subtab-btn active" data-subtab="about">Приложение</button>
        <button class="subtab-btn" data-subtab="errors">Ошибки</button>
      </div>
      <div class="subtab-panel active" data-group="happ" data-subtab="about" id="happAbout"></div>
      <div class="subtab-panel" data-group="happ" data-subtab="errors">
        <div class="page-toolbar">
          <input type="text" class="filter-input" id="happFilter" placeholder="Найти по симптому, коду или строке из лога…">
          <span class="count-pill" id="happCount"></span>
        </div>
        <div class="cat-groups" id="happCatalog"></div>
      </div>
    </div>
  </div>
</main>
<div id="djarbFooter"></div>
</div><!-- /#siteContent -->

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="catalog.js"></script>
<script src="apps-about.js"></script>

<script src="extra.js"></script>
<script src="layout.js"></script>
<script src="page-happ.js"></script>
<script>
  DJARB.initLayout({ page: 'apps', title: 'Приложение Happ — DJARB VPN', crumbTitle: 'Happ' });
  DJARB.initHappPage();
</script>
